<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneDesk VMS | Droisys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Sora","Space Grotesk",system-ui,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.9,.24,1); --spring:cubic-bezier(.3,1.35,.45,1); --r-panel:20px; --r-ctl:12px;
  --bg:#060914; --panel:rgba(16,24,50,.52); --panel-solid:#0E1530; --line:rgba(150,175,255,.10); --line2:rgba(150,175,255,.22);
  --ink:#E9EEFF; --ink2:#C6CFEA; --muted:#8792B4; --blue:#5B8CFF; --blue-ink:#050816; --cyan:#3FD0FF; --violet:#8C7CFF;
  --blue-soft:rgba(91,140,255,.14); --chip:rgba(150,175,255,.07); --warm:#3DDCA0; --mild:#F5B451; --cold:#FF7A6B;
  --edge:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 38%,rgba(140,124,255,.18) 100%);
  --aurA:rgba(63,208,255,.20); --aurB:rgba(140,124,255,.22); --aurC:rgba(61,220,160,.08);
  --glass-top:rgba(255,255,255,.045); --shadow:0 24px 60px -32px rgba(0,0,0,.85); --logo:invert(1) brightness(1.2); color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5FB; --panel:rgba(255,255,255,.72); --panel-solid:#FFFFFF; --line:rgba(20,30,70,.09); --line2:rgba(20,30,70,.18);
    --ink:#0D1530; --ink2:#26304F; --muted:#5D6889; --blue:#2F5BFF; --blue-ink:#FFFFFF; --cyan:#0A8FBF; --violet:#6A55E8;
    --blue-soft:rgba(47,91,255,.09); --chip:rgba(20,30,70,.05); --warm:#16835A; --mild:#B26B0E; --cold:#C9412C;
    --edge:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.4) 40%,rgba(106,85,232,.18));
    --aurA:rgba(10,143,191,.10); --aurB:rgba(106,85,232,.10); --aurC:rgba(22,131,90,.05);
    --glass-top:rgba(255,255,255,.6); --shadow:0 22px 50px -30px rgba(20,30,70,.35); --logo:none; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F5FB; --panel:rgba(255,255,255,.72); --panel-solid:#FFFFFF; --line:rgba(20,30,70,.09); --line2:rgba(20,30,70,.18);
  --ink:#0D1530; --ink2:#26304F; --muted:#5D6889; --blue:#2F5BFF; --blue-ink:#FFFFFF; --cyan:#0A8FBF; --violet:#6A55E8;
  --blue-soft:rgba(47,91,255,.09); --chip:rgba(20,30,70,.05); --warm:#16835A; --mild:#B26B0E; --cold:#C9412C;
  --edge:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.4) 40%,rgba(106,85,232,.18));
  --aurA:rgba(10,143,191,.10); --aurB:rgba(106,85,232,.10); --aurC:rgba(22,131,90,.05);
  --glass-top:rgba(255,255,255,.6); --shadow:0 22px 50px -30px rgba(20,30,70,.35); --logo:none; color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;letter-spacing:.003em;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:.86rem}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.aurora{position:fixed;inset:-20vmax;z-index:0;pointer-events:none;filter:blur(60px) saturate(120%);opacity:.95}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:60vmax;height:44vmax;left:8%;top:-6%;background:radial-gradient(closest-side,var(--aurA),transparent);animation:d1 38s var(--ease) infinite alternate}
.aurora i:nth-child(2){width:54vmax;height:50vmax;right:2%;top:12%;background:radial-gradient(closest-side,var(--aurB),transparent);animation:d2 46s var(--ease) infinite alternate}
.aurora i:nth-child(3){width:46vmax;height:36vmax;left:30%;bottom:-4%;background:radial-gradient(closest-side,var(--aurC),transparent);animation:d3 52s var(--ease) infinite alternate}
:root[data-theme="light"] .aurora i{mix-blend-mode:multiply}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .aurora i{mix-blend-mode:multiply}}
@keyframes d1{to{transform:translate3d(14vmax,8vmax,0) scale(1.15)}}@keyframes d2{to{transform:translate3d(-12vmax,10vmax,0) scale(.9)}}@keyframes d3{to{transform:translate3d(8vmax,-10vmax,0) scale(1.2)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:3px 3px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%)}
:root[data-theme="light"] .grain{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .grain{display:none}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:6px;padding:20px 14px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.brand img{height:30px;width:auto;filter:var(--logo)}
.brand b{display:block;font-family:var(--display);letter-spacing:.3em;font-weight:500;font-size:.82rem;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-family:var(--display);font-size:.66rem;letter-spacing:.2em;color:var(--muted)}
.nav{position:relative;flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.nav h6{margin:14px 10px 4px;font:500 .68rem var(--display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:12px;cursor:pointer;color:var(--ink2);font-family:var(--display);font-size:.9rem;text-align:left;position:relative;z-index:1;transition:color .25s var(--ease),background .25s var(--ease)}
.nav-item svg{opacity:.85}
.nav-item:hover{background:var(--chip);color:var(--ink)}
.nav-item[aria-current="true"]{color:var(--ink)}
.nav-item[aria-current="true"] svg{color:var(--cyan);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--cyan) 60%,transparent))}
.nav-item .cnt{margin-left:auto;font-size:.72rem;background:linear-gradient(135deg,var(--cold),#FF9A6B);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.nav-ind{position:absolute;left:0;right:0;top:0;height:var(--ind-h,36px);transform:translateY(var(--ind-y,0));border-radius:12px;pointer-events:none;z-index:0;background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 16%,transparent),color-mix(in srgb,var(--violet) 10%,transparent) 70%,transparent);transition:transform .55s var(--spring),height .4s var(--ease),opacity .3s;opacity:var(--ind-o,0)}
.nav-ind::before{content:"";position:absolute;left:-14px;top:22%;bottom:22%;width:3px;border-radius:3px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 14px 2px color-mix(in srgb,var(--cyan) 55%,transparent)}
.me{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--chip);font-size:.8rem}
.me label{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;color:var(--muted)}
.me select{width:100%;padding:5px 8px;border-radius:9px;border:1px solid var(--line2);background:color-mix(in srgb,var(--panel-solid) 70%,transparent);color:var(--ink);font-size:.8rem}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{position:relative;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line);z-index:20}
.trace{position:absolute;left:0;right:0;bottom:-1px;height:1px;overflow:hidden;pointer-events:none}
.trace::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-40%;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);box-shadow:0 0 12px var(--cyan);animation:trace 1.4s var(--ease) .05s both}
@keyframes trace{to{left:105%}}
.iconbtn.menu-btn{display:none}
.search{position:relative;flex:1;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--panel-solid) 50%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.search svg{opacity:.6}
.search input{border:0;background:none;outline:none;width:100%;padding:0}
.search input:focus{box-shadow:none}
.results{position:absolute;left:0;right:0;top:46px;background:color-mix(in srgb,var(--panel-solid) 94%,transparent);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(24px);z-index:30;max-height:360px;overflow:auto;padding:6px}
.results div{padding:9px 12px;display:flex;gap:10px;cursor:pointer;align-items:center;border-radius:9px}
.results div:hover{background:var(--chip)}.results small{color:var(--muted);margin-left:auto}
.iconbtn{position:relative;background:none;border:1px solid transparent;cursor:pointer;color:var(--ink2);padding:8px;border-radius:11px;display:grid;place-items:center}
.iconbtn:hover{background:var(--chip);border-color:var(--line)}
.dot{position:absolute;top:-3px;right:-3px;background:var(--cold);color:#fff;border-radius:9px;font-size:.66rem;font-weight:700;min-width:17px;line-height:17px;text-align:center}
.avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--blue-soft),transparent);border:1px solid var(--line2);color:var(--cyan);font:600 .8rem var(--display);display:grid;place-items:center;flex:none}
.pop{position:absolute;right:28px;top:62px;width:360px;background:color-mix(in srgb,var(--panel-solid) 92%,transparent);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(24px);z-index:40;padding:8px}
.pop h4{margin:8px 10px;font:600 .95rem var(--display)}
.pop .al{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:.88rem}
.pop .al:hover{background:var(--chip)}
.page{flex:1;overflow:auto;padding:26px 28px 64px;min-height:0}
.wrap{max-width:1640px;margin:0 auto}
.enter{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:1.65rem;font-weight:600;letter-spacing:-.03em;margin:0 0 4px}
.sub0{color:var(--muted);margin:0}
h3{font-size:1.02rem;letter-spacing:-.01em;margin:0 0 14px}
.panel{position:relative;background:linear-gradient(180deg,var(--glass-top),transparent 48%),var(--panel);border:1px solid transparent;border-radius:var(--r-panel);padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);isolation:isolate}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s var(--ease);background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(140,124,255,.10),transparent 60%)}
.panel:hover::after{opacity:1}
.panel.flush{padding:0;overflow:hidden}
.panel.ai{background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 10%,transparent),color-mix(in srgb,var(--cyan) 6%,transparent) 60%,transparent),var(--panel)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.stack{display:grid;gap:16px}
.kpi{padding:18px 18px 16px;overflow:hidden}
.kpi .k-top{position:absolute;left:16px;right:16px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--k,var(--cyan)),transparent)}
.kpi .lab{font-size:.82rem;color:var(--muted);letter-spacing:.01em;display:block}
.kpi .val{display:block;font-family:var(--display);font-weight:600;font-size:2rem;line-height:1.1;margin:6px 0 4px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,var(--ink) 30%,color-mix(in srgb,var(--ink) 60%,var(--k,var(--cyan))));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .sub{font-size:.82rem;color:var(--ink2)}.kpi .sub b{color:var(--k,var(--cyan));font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:var(--r-ctl);cursor:pointer;font:600 .86rem var(--body);white-space:nowrap;position:relative;overflow:hidden;transition:transform .15s var(--ease),background .25s,border-color .25s,box-shadow .25s}
.btn:active{transform:scale(.975)}
.btn:hover{border-color:color-mix(in srgb,var(--cyan) 45%,var(--line2));background:color-mix(in srgb,var(--cyan) 6%,var(--panel))}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue) 55%,var(--violet));background-size:160% 160%;background-position:0% 50%;color:#fff;border:0;box-shadow:0 8px 24px -10px color-mix(in srgb,var(--blue) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.15);padding:9px 16px;transition:background-position .6s var(--ease),transform .15s var(--ease),box-shadow .3s}
.btn.primary:hover{background-position:100% 50%}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.sm{padding:4px 11px;font-size:.78rem;border-radius:10px}
.btn.danger{color:var(--cold)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:saturate(.5)}
.lnk{color:var(--cyan);cursor:pointer;background:none;border:0;padding:0;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line2);background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-size:.84rem;transition:background .2s,border-color .2s,transform .15s var(--ease)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 22%,transparent),color-mix(in srgb,var(--violet) 22%,transparent));border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
.tabs{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-bottom:18px;flex-wrap:wrap;background:var(--chip)}
.tab{background:none;border:0;color:var(--muted);padding:8px 16px;cursor:pointer;font:500 .88rem var(--display)}
.tab+.tab{border-left:1px solid var(--line2)}
.tab[aria-selected="true"]{background:var(--blue-soft);color:var(--ink)}
input,select,textarea{border-radius:var(--r-ctl);background:color-mix(in srgb,var(--panel-solid) 55%,transparent);border:1px solid var(--line2);transition:border-color .2s,box-shadow .25s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 16%,transparent)}
select option{background:var(--panel-solid);color:var(--ink)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.f{display:grid;gap:5px}.f label{font-size:.8rem;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{padding:9px 11px;width:100%}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font:500 .76rem var(--display);color:var(--muted);text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .2s var(--ease)}
.tbl tbody tr.click{cursor:pointer}.tbl tbody tr:hover td{background:var(--chip)}
.tbl tr.grp td{background:var(--chip);font-family:var(--display);font-weight:600}
.mono{font-family:var(--mono);font-size:.8rem;color:var(--ink2)}
.t2{display:block;font-size:.78rem;color:var(--muted);margin-top:1px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.74rem;padding:2px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.ok{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 35%,transparent);background:color-mix(in srgb,var(--warm) 10%,transparent)}
.pill.warn{color:var(--mild);border-color:color-mix(in srgb,var(--mild) 35%,transparent);background:color-mix(in srgb,var(--mild) 10%,transparent)}
.pill.bad{color:var(--cold);border-color:color-mix(in srgb,var(--cold) 35%,transparent);background:color-mix(in srgb,var(--cold) 10%,transparent)}
.pill.info{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 35%,transparent);background:color-mix(in srgb,var(--cyan) 10%,transparent)}
.good{color:var(--warm);font-weight:700}.badc{color:var(--cold);font-weight:700}.warnc{color:var(--mild);font-weight:700}
.trk{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.trk i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:4px;transform-origin:left;animation:grow 1.1s var(--ease) .15s both}
.trk.w i{background:linear-gradient(90deg,var(--mild),#FF9A6B)}.trk.b i{background:linear-gradient(90deg,var(--cold),#FF9A6B)}
@keyframes grow{from{transform:scaleX(0)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brow{margin-bottom:14px}.brow .row{margin-bottom:6px}
.sp{height:1px;background:var(--line);margin:14px 0}
.cols{display:flex;gap:14px;align-items:flex-end;height:210px;padding-top:24px}
.cols>div{flex:1;text-align:center;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:linear-gradient(180deg,var(--cyan),var(--violet));border-radius:7px 7px 0 0;margin:4px 0 8px;transform-origin:bottom;animation:rise .9s var(--ease) both;box-shadow:0 0 18px -6px var(--cyan)}
.cols em{font-style:normal;color:var(--ink)}
@keyframes rise{from{transform:scaleY(0)}}
.sc{display:flex;gap:6px;margin-top:10px}.sc>div{flex:1}.sc i{display:block;height:6px;border-radius:3px;background:var(--chip);margin-bottom:6px;border:1px solid var(--line)}.sc i.f{background:linear-gradient(90deg,var(--cyan),var(--blue));border-color:transparent}.sc span{font-size:.76rem;color:var(--muted)}
.doc{display:inline-flex;gap:4px;padding:3px 11px;border-radius:999px;border:1px solid var(--line2);font-size:.78rem;cursor:pointer;margin:0 6px 6px 0;background:transparent}
.doc.ok{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 35%,transparent);background:color-mix(in srgb,var(--warm) 10%,transparent)}
.doc.up{color:var(--mild);border-color:color-mix(in srgb,var(--mild) 35%,transparent);background:color-mix(in srgb,var(--mild) 10%,transparent)}
.flow{display:flex;flex-wrap:wrap;margin-bottom:18px}

function lineOf(t){
  const w=wk(t.w),hrs=t.h+t.ot,br=t.rate||w.bill;
  const inn=hrs*br,out=hrs*w.pay;
  const f=[];
  if(t.pay!=='paid'){
    if(t.st==='Pending Approval')f.push({s:'block',t:'Timesheet not approved'});
    if(t.st!=='Pending Approval'&&!t.inv)f.push({s:'warn',t:'Approved but not invoiced'});
    const inv=t.inv&&D.ar.find(a=>a.id===t.inv);
    if(inv&&inv.st==='Disputed')f.push({s:'block',t:'Customer disputed '+inv.id});
    if(t.inv&&!t.paid&&!(inv&&inv.st==='Disputed'))f.push({s:'info',t:'Awaiting customer funds'});
    if(t.rate&&t.rate!==w.bill)f.push({s:'block',t:'Rate mismatch: billed $'+t.rate+' vs contract $'+w.bill});
    const po=D.pos.find(p=>p.id===w.po);
    if(po&&po.cap-po.used<out)f.push({s:'block',t:po.id+' has only '+fmt(po.cap-po.used)+' left'});
    if(w.st==='Onboarding'&&DOCS.some(d=>w.docs[d]!=='ok'))f.push({s:'block',t:'Onboarding documents incomplete'});
    const dl=daysTo(w.e);if(dl>=0&&dl<=30)f.push({s:'warn',t:'Contract ends in '+dl+' days'});
    const sp=D.sups.find(x=>x.n===w.v);if(sp&&sp.bankChange&&!sp.bankChange.verified)f.push({s:'block',t:'Bank details changed, verification pending'});
  }
  let ps;
  if(t.st==='Pending Approval')ps='Awaiting timesheet';
  else if(t.pay==='paid')ps='Paid out';
  else if(t.pay==='approved')ps=t.paid?'Approved, ready to release':'Approved, awaiting funds';
  else if(t.pay==='held')ps='On hold';
  else if(t.pay==='approval2')ps='Awaiting second approval';
  else ps='Pending approval';
  return {t,w,hrs,br,inn,out,mar:inn-out,flags:f,block:f.some(x=>x.s==='block'),ps};
}

function matchScore(c,r){
  const need=r.skills,have=c.skills.map(s=>s.toLowerCase());
  const miss=need.filter(s=>!have.includes(s.toLowerCase()));
  const skill=(need.length-miss.length)/need.length;
  const locS=r.mode==='Remote'||c.loc==='Remote'?1:(c.loc===r.loc?1:(c.loc.split(', ')[1]===r.loc.split(', ')[1]?.6:.3));
  const rateS=Math.max(.25,Math.min(1,1-Math.max(0,(c.rate-.9*r.rate))/(.3*r.rate)));
  const avS=Math.max(.3,1-c.av/60);
  const tot=Math.round((skill*.55+locS*.2+rateS*.1+avS*.15)*100);
  return {skill,locS,rateS,avS,tot,miss,prob:Math.round(tot*.86)};
}

const SUP_NOTE=(s)=>{
  const tp=[],q=[],w=[];
  tp.push('Scorecard is '+s.score+' with a fill rate of '+s.fill+'% and compliance at '+s.comp+'%.');
  if(s.fill<65)tp.push('Fill rate is below the 65% target. Ask what is blocking submissions.');
  if(s.ttf)tp.push('Average time to fill is '+s.ttf+' days against our 18-day goal.');
  q.push('Which open requisitions can you submit against this week?');
  if(s.int<40)q.push('Why is interview success only '+s.int+'%? Are you screening against the full skill list?');
  if(s.st==='Probation')q.push('What is the plan to exit probation?');
  if(s.contract!=='Signed')w.push('Vendor agreement is not signed yet.');
  if(daysTo(s.coi)<=60)w.push('Insurance certificate expires '+s.coi+' ('+Math.max(daysTo(s.coi),0)+' days).');
  if(s.payout!=='Verified')w.push('Payout account is not verified, so no payments can be released.');
  if(!w.length)w.push('No open compliance risks.');
  return {tp,q,w};
};

  const pay=Math.round(r.rate*.78),mk=Math.round((r.rate/pay-1)*100),mr=Math.round(r.rate*.96);
  const bar=(v,l)=>'<div><small>'+l+'</small><div class="trk '+(v<.5?'b':v<.8?'w':'')+'"><i style="width:'+Math.round(v*100)+'%"></i></div></div>';
  return head('OneDesk ranking','Ranks the talent pool against a requisition',btn('Send top 3 to customer','sendtop','','primary'))+
  '<div class="grid split"><div class="panel"><div class="f"><label for="mr">Requisition</label><select id="mr" data-a="matchreq">'+D.reqs.filter(openReq).map(x=>'<option value="'+x.id+'"'+(x.id===r.id?' selected':'')+'>'+x.id+' · '+esc(x.title)+'</option>').join('')+'</select></div><p class="muted small" style="margin:10px 0 0">Required: '+r.skills.join(', ')+' · '+esc(r.loc)+' ('+r.mode+')</p></div>'+
  '<div class="panel"><b class="muted small">Rate optimization</b>'+[['Bill rate','$'+r.rate],['Suggested pay','$'+pay],['Markup',mk+'%'],['Market rate','$'+mr]].map(x=>'<div class="row" style="margin-top:8px"><span>'+x[0]+'</span><b class="num">'+x[1]+'</b></div>').join('')+'</div></div>'+
  '<div class="panel flush" style="margin-top:16px">'+pool.map((x,i)=>'<div class="mrow"><div class="rank">#'+(i+1)+'</div><div><b>'+esc(x.c.n)+'</b><span class="t2">'+esc(x.c.sup)+' · '+x.c.exp+' yrs · $'+x.c.rate+'/hr</span>'+(x.m.miss.length?'<span class="gap">Gap: '+x.m.miss.join(', ')+'</span>':'<span class="good small">All required skills</span>')+'</div><div class="ms">'+bar(x.m.skill,'Skill')+'</div><div class="ms">'+bar(x.m.locS,'Location')+'</div><div class="ms">'+bar(x.m.rateS,'Rate')+'</div><div class="ms">'+bar(x.m.avS,'Availability')+'</div><div><div class="pct">'+x.m.tot+'%</div><div class="muted small" style="text-align:right">Interview prob. '+x.m.prob+'%</div></div></div>').join('')+'</div>';
};

ACT.sendtop=()=>{const r=reqOf(S.matchReq),top=D.cands.filter(c=>inV(c.sup)).map(c=>({c,m:matchScore(c,r)})).sort((a,b)=>b.m.tot-a.m.tot).slice(0,3);log('Sent top 3 to customer',r.id+': '+top.map(x=>x.c.n).join(', '));toast('Top 3 for '+r.id+' sent to '+r.client+' for review')};

P.time=()=>{
  const T=vTs().filter(t=>t.st!=='Rejected'),pend=T.filter(t=>t.st==='Pending Approval').length;
  const wkT=T.filter(t=>t.wk==='2026-10-04'),hrs=sum(wkT,t=>t.h+t.ot);
  const app=sum(T.filter(t=>t.st==='Approved'),t=>lineOf(t).inn);
  const flow=['Contractor','Timesheet','Customer approval','BMS decision','VMS payout','Accounting class'],fs=['Submits or uploads','Hours and bill rate read','Via customer SSO or here','Approve, hold or reject','Single-check redistribution','Division and PO'];
  return head('Time & Expense','Contractor → Timesheet → Approval → Payout → Invoice',btn('Upload timesheet','upts','','primary'))+
  '<div class="flow">'+flow.map((f,i)=>'<div><b>'+f+'</b><span>'+fs[i]+'</span></div>').join('')+'</div>'+
  '<div class="grid g3" style="margin-bottom:16px">'+kpi('Pending approval',pend+D.exps.filter(e=>e.st==='Pending Approval').length,'timesheets and expenses','var(--mild)')+kpi('Hours this week',hrs,'week ending 2026-10-04')+kpi('Approved value',fmt(app),'ready to invoice','var(--warm)')+'</div>'+
  tabs([['ts','Timesheets'],['ex','Expenses']],S.timeTab,'timetab')+
  (S.timeTab==='ts'?'<div class="panel flush">'+tbl(['ID','Contractor','Customer','Week ending','Hours','OT','Billable','Source','Status',''],vTs().map(t=>{const l=lineOf(t);
   return '<tr><td class="mono">'+t.id+'</td><td><b>'+esc(l.w.n)+'</b><span class="t2">'+esc(l.w.v)+'</span></td><td>'+esc(l.w.client)+'</td><td class="mono">'+t.wk+'</td><td class="num">'+t.h+'</td><td class="num">'+t.ot+'</td><td class="num">'+fmt(l.inn)+'</td><td><span class="pill '+(t.src==='Native'?'':'info')+'">'+esc(t.src)+'</span></td><td>'+badge(t.st)+'</td><td style="white-space:nowrap">'+(t.st==='Pending Approval'?btn('Approve','tsapp','data-id="'+t.id+'"'+(can('ts')?'':' disabled title="Your role cannot approve timesheets"'),'sm')+' '+btn('Reject','tsrej','data-id="'+t.id+'"'+(can('ts')?'':' disabled'),'sm danger'):'')+'</td></tr>'}))+'</div>':
   '<div class="panel flush">'+tbl(['ID','Contractor','Expense','Amount','Status',''],D.exps.filter(e=>{const w=wk(e.w);return inC(w.client)&&inV(w.v)}).map(e=>'<tr><td class="mono">'+e.id+'</td><td><b>'+esc(wk(e.w).n)+'</b></td><td>'+esc(e.what)+'</td><td class="num">'+fmt(e.amt)+'</td><td>'+badge(e.st)+'</td><td>'+(e.st==='Pending Approval'?btn('Approve','exapp','data-id="'+e.id+'"'+(can('ts')?'':' disabled'),'sm'):'')+'</td></tr>'))+'</div>');
};

ACT.tsapp=d=>{const t=D.ts.find(x=>x.id===d.id);t.st='Approved';t.pay='pending';log('Approved timesheet',t.id);toast(t.id+' approved. It now shows in Payment Approvals.');render()};
ACT.tsrej=d=>{const t=D.ts.find(x=>x.id===d.id);t.st='Rejected';t.pay='none';log('Rejected timesheet',t.id);toast(t.id+' rejected');render()};

ACT.upts=()=>{S.up={w:'',img:null,name:'',h:40,ot:0,done:false};modal('Upload timesheet screenshot',upBody(),upFoot(),true)};
const upWorkers=()=>vWorkers().filter(w=>w.st==='Active'||w.st==='Ending Soon');
function upBody(){
  const u=S.up,w=u.w&&wk(u.w);
  let h='<div class="f2">'+sel('up-w','Contractor',[['','Select contractor']].concat(upWorkers().map(x=>[x.id,x.n+' · '+x.v])),u.w)+fld('up-wk','Week ending','2026-10-11','date')+'</div>';
  h+=u.img?'<div><img class="prev" src="'+u.img+'" alt="Timesheet screenshot preview"><div class="muted small" style="margin-top:6px">'+esc(u.name)+'</div></div>':'<label class="drop" for="up-f">'+ic('search')+'<div style="margin-top:6px">Choose a timesheet screenshot (PNG, JPG)</div><div class="small">The hours and bill rate are read from the image and checked against the contract.</div></label>';
  h+='<input type="file" id="up-f" accept="image/*" data-a="upfile" style="display:none">';
  if(u.done&&w){const br=w.bill,tot=(+u.h+ +u.ot)*br;
    h+='<div class="panel ai" style="padding:16px"><div class="row"><b>Read from screenshot</b><span class="pill info">Demo read. Production reads the image with AI.</span></div><div class="f2" style="margin-top:12px">'+fld('up-h','Regular hours',u.h,'number','data-a="uprecalc"')+fld('up-o','Overtime hours',u.ot,'number','data-a="uprecalc"')+'</div><dl class="kv" style="margin-top:12px"><dt>Contractor</dt><dd>'+esc(w.n)+' <span class="good">active contract</span></dd><dt>Contract bill rate</dt><dd>$'+br+'/hr (from '+w.po+')</dd><dt>Invoice amount</dt><dd id="up-tot"><b class="num">'+fmt(tot)+'</b></dd><dt>Supplier payout</dt><dd id="up-pay">'+fmt((+u.h+ +u.ot)*w.pay)+'</dd></dl></div>';}

const upFoot=()=>{const u=S.up;return btn('Cancel','close')+(u.done?btn('Create timesheet','upsave','','primary'):btn('Read timesheet','upread','','primary'))};

/* ---- layers: stack, back, refresh ---- */
function openLayer(fn,over){const prev=over?S.reopen:null;const st=over?S.stack.slice():[];if(over&&prev)st.push(prev);fn();S.stack=st;S.reopen=fn}
function back(){const f=S.stack.pop(),st=S.stack.slice();closeLayer();if(f){f();S.reopen=f;S.stack=st}}
function refresh(){render();const r=S.reopen,st=S.stack.slice();if(r){S.still=true;r();S.still=false;S.reopen=r;S.stack=st}}

function dst(d){if(['Pending signature','Declined','Draft'].includes(d.st))return d.st;if(d.exp){if(d.exp<TODAY)return 'Expired';if(daysTo(d.exp)<=60)return 'Expiring'}return d.st}
function entLabel(d){if(d.kind==='candidate'){const p=d.key.split('|');return p[0]+' · '+p[1]}if(d.kind==='worker'){const w=wk(d.key);return w?w.n:d.key}return d.key}
function entInfo(d){
  if(d.kind==='candidate'){const p=d.key.split('|'),c=D.cands.find(x=>x.n===p[0]&&x.req===p[1]),r=reqOf(p[1]);return {client:r&&r.client,vendor:c&&c.sup}}
  if(d.kind==='worker'){const w=wk(d.key);return {client:w&&w.client,vendor:w&&w.v,self:d.key}}
  if(d.kind==='supplier')return {vendor:d.key};
  if(d.kind==='customer')return {client:d.key};
  if(d.kind==='sow'){const s=D.sows.find(x=>x.id===d.key);return {client:s&&s.customer}}
  if(d.kind==='requisition'){const r=reqOf(d.key);return {client:r&&r.client}}
  if(d.kind==='po'){const p=D.pos.find(x=>x.id===d.key);return p?(p.type==='Vendor PO'?{vendor:p.party}:{client:p.party}):{}}
  return {};
}
function docVis(d){const r=S.role;if(['super','msp','fin'].includes(r))return true;if(d.vis!=='shared')return false;const i=entInfo(d);
  if(r==='sup')return i.vendor===S.vendor;if(r==='cand')return i.self===S.portalW;return !i.client||inC(i.client)}
const visDocs=()=>D.docs.filter(docVis);
const docsFor=(k,key)=>D.docs.filter(d=>d.kind===k&&d.key===key&&docVis(d));
function missing(kind,key){const need=REQ_DOCS[kind]||[],ds=D.docs.filter(d=>d.kind===kind&&d.key===key);
  return need.filter(t=>!ds.some(d=>d.type===t&&(SIGN_TYPES.includes(t)?(d.st==='Signed'&&dst(d)!=='Expired'):(d.st!=='Draft'&&dst(d)!=='Expired'))))}
const recipientFor=(kind,key)=>kind==='candidate'?((D.cands.find(c=>c.n===key.split('|')[0])||{}).sup||'the supplier'):kind==='supplier'?((supOf(key)||{}).contact||'the supplier'):kind==='worker'?'the contractor':'the customer contact';
function hist(d,act){d.hist.push({t:nowStamp(),by:ME.name,act:act})}
function entList(kind){
  if(kind==='candidate')return D.cands.map(c=>[c.n+'|'+c.req,c.n+' · '+c.req]);
  if(kind==='worker')return D.workers.map(w=>[w.id,w.n]);
  if(kind==='supplier')return D.sups.map(s=>[s.n,s.n]);
  if(kind==='customer')return CLIENTS.map(c=>[c,c]);
  if(kind==='requisition')return D.reqs.map(r=>[r.id,r.id+' · '+r.title]);
  if(kind==='sow')return D.sows.map(s=>[s.id,s.id+' · '+s.title]);
  if(kind==='po')return D.pos.map(p=>[p.id,p.id+' · '+p.party]);return [];
}
function readFiles(list){return Promise.all(Array.from(list).map(f=>new Promise(res=>{const o={name:f.name,size:f.size,mime:f.type||'',data:null};if(f.size>1500000){res(o);return}const rd=new FileReader();rd.onload=()=>{o.data=rd.result;res(o)};rd.onerror=()=>res(o);rd.readAsDataURL(f)})))}
function mkDoc(kind,key,f,o){const id=nextId(D.docs,'DOC-',2000);
  const d={id:id,name:f.name,type:o.type||'Other',kind:kind,key:key,size:f.size||0,mime:f.mime||'',by:ME.name,on:TODAY,ver:1,vers:[{v:1,name:f.name,size:f.size||0,on:TODAY,by:ME.name,data:f.data||null,text:f.text}],st:'Active',exp:o.exp||null,vis:o.vis||'internal',note:o.note||'',data:f.data||null,hist:[{t:nowStamp(),by:ME.name,act:'Uploaded'}]};
  if(f.text!==undefined)d.text=f.text;D.docs.unshift(d);return d}
function markSigned(d,note){d.st='Signed';d.signedOn=TODAY;d.cert=hash(d.id+d.name+TODAY+d.ver);hist(d,'Signed'+(note?' ('+note+')':''));
  if(d.kind==='sow'&&d.type==='SOW'){const s=D.sows.find(x=>x.id===d.key);if(s&&s.st!=='Closed')s.st='Active'}
  if(d.kind==='supplier'&&d.type==='Vendor agreement'){const s=supOf(d.key);if(s)s.contract='Signed'}}
const icoFor=d=>/image/.test(d.mime)?'eye':'file';

/* ---- document list inside any record ---- */
function docRow(d){const s=dst(d);
  return '<div class="docrow"><span class="dico">'+ic(icoFor(d))+'</span><div class="dmeta"><button class="lnk" data-a="docopen" data-id="'+d.id+'" title="'+esc(d.name)+'">'+esc(d.name)+'</button><span class="t2">'+esc(d.type)+' · v'+d.ver+' · '+fmtSize(d.size)+' · '+d.on+' · '+esc(d.by)+(d.vis==='shared'?' · shared':'')+'</span></div>'+badge(s,DB[s])+'<span class="nw"><button class="iconbtn" data-a="docopen" data-id="'+d.id+'" aria-label="View '+esc(d.name)+'" title="View">'+ic('eye')+'</button>'+(can('docdel')?'<button class="iconbtn" data-a="docdel" data-id="'+d.id+'" aria-label="Remove '+esc(d.name)+'" title="Remove">'+ic('trash')+'</button>':'')+'</span></div>'}
function docPanel(kind,key){
  const ds=docsFor(kind,key),miss=missing(kind,key);
  return '<div class="row" style="flex-wrap:wrap"><h3 style="margin:0">Documents <span class="muted small">('+ds.length+')</span></h3>'+(can('docs')?btn(ic('paperclip')+' Add attachment','upopen','data-k="'+kind+'" data-key="'+esc(key)+'"','sm primary'):'')+'</div>'+
  (miss.length?'<div class="note warn" style="margin-top:10px">Missing: <b>'+miss.map(esc).join(', ')+'</b> '+(can('docs')?btn('Request','docreq','data-k="'+kind+'" data-key="'+esc(key)+'"','sm'):'')+'</div>':(REQ_DOCS[kind]?'<div class="note" style="margin-top:10px">All required documents are on file.</div>':''))+
  '<div style="margin-top:8px">'+(ds.length?ds.map(docRow).join(''):'<div class="empty">No documents yet.</div>')+'</div>';
}
ACT.docreq=d=>{const m=missing(d.k,d.key);const who=recipientFor(d.k,d.key);log('Requested documents: '+m.join(', '),entLabel({kind:d.k,key:d.key}),'Sequence');toast('Request for '+m.join(', ')+' sent to '+who+' from '+SYS())};

/* ---- upload ---- */
const defType=(k,key)=>{const m=key?missing(k,key):[];return m[0]||({candidate:'Resume',worker:'Work authorization',supplier:'W-9',customer:'MSA',sow:'SOW',requisition:'Job description',po:'Purchase order'}[k]||'Other')};
function uploadModal(kind,key){
  S.upf=[];S.upKind=kind||'candidate';S.upKey=key||'';
  const fixed=!!key;
  modal('Add attachment',(fixed?'<div class="note">Attaching to <b>'+esc(entLabel({kind:kind,key:key}))+'</b></div>':'<div class="f2">'+sel('up-k','Attach to',KINDS,S.upKind).replace('<select id="up-k"','<select id="up-k" data-a="upkind"')+'<div id="up-ew">'+sel('up-e','Record',entList(S.upKind),'')+'</div></div>')+
   '<label class="drop" for="up-files">'+ic('upload')+'<div style="margin-top:6px">Choose files. You can pick several at once.</div></label><input type="file" id="up-files" multiple data-a="upfiles" style="display:none"><div id="up-list" class="small muted"></div>'+
   '<div class="f2">'+sel('up-t','Document type',DOC_TYPES.map(t=>[t,t]),defType(kind,key))+sel('up-st','Status',[['Active','Final or reference'],['Signed','Already signed'],['Draft','Draft, not signed yet']],'Active')+'</div><div class="f2">'+sel('up-v','Who can see it',VIS,'internal')+fld('up-x','Expires on (optional)','','date')+'</div>'+fld('up-n','Note (optional)',''),
   btn('Cancel','close')+btn('Upload','upcommit','','primary'),false);
}
ACT.upopen=d=>openLayer(()=>uploadModal(d.k,d.key),true);
ACT.upkind=(d,el)=>{S.upKind=el.value;document.getElementById('up-ew').innerHTML=sel('up-e','Record',entList(el.value),'');document.getElementById('up-t').value=defType(el.value,'')};
ACT.upfiles=(d,el)=>readFiles(el.files).then(arr=>{S.upf=arr;document.getElementById('up-list').innerHTML=arr.map(f=>'<div>'+ic('file')+' '+esc(f.name)+' <span class="muted">('+fmtSize(f.size)+(f.data?'':', preview skipped over 1.5 MB')+')</span></div>').join('')});
ACT.upcommit=()=>{
  const kind=S.upKey?S.upKind:val('up-k'),key=S.upKey||val('up-e');
  if(!key){toast('Choose the record first');return}if(!S.upf.length){toast('Choose at least one file');return}
  if(storeUsed()+sum(S.upf,f=>f.size)>storeLimit()){toast('Storage limit reached for the '+ORG().plan+' plan');return}
  const n=S.upf.length;
  S.upf.forEach(f=>{const d=mkDoc(kind,key,f,{type:val('up-t'),vis:val('up-v'),exp:val('up-x'),note:val('up-n')});d.st=val('up-st')||'Active';if(d.st==='Signed'){d.sign={sent:nowStamp(),via:'Uploaded signed copy',order:'',signers:[]};markSigned(d,'uploaded as signed copy')}});
  log('Attached '+n+' document'+(n>1?'s':''),entLabel({kind:kind,key:key}),'Documents');S.upf=[];
  const st=S.stack.slice(),f=st.pop();closeLayer();if(f){f();S.reopen=f;S.stack=st}
  toast(n+' document'+(n>1?'s':'')+' attached');render();
};

/* ---- viewer ---- */
function sigBlock(d){
  if(!d.sign)return '';const sg=d.sign;
  return '<div class="panel" style="padding:16px"><div class="row"><b>Signatures</b><span class="muted small">via '+esc(sg.via)+(sg.order?' · '+esc(sg.order):'')+'</span></div>'+
   (sg.signers.length?tbl(['Signer','Email','Status','When',''],sg.signers.map((x,i)=>'<tr><td>'+esc(x.n)+'</td><td class="small">'+esc(x.e)+'</td><td>'+badge(x.st,x.st==='Signed'?'ok':x.st==='Declined'?'bad':'warn')+'</td><td class="mono">'+(x.on||'')+'</td><td class="nw">'+(d.st==='Pending signature'&&x.st!=='Signed'&&x.st!=='Declined'&&can('sign')?btn('Mark signed (demo)','signmark','data-id="'+d.id+'" data-i="'+i+'"','sm')+' '+btn('Decline','signdec','data-id="'+d.id+'" data-i="'+i+'"','sm danger'):'')+'</td></tr>'),'tight'):'<p class="muted small" style="margin:8px 0 0">Signed copy was uploaded, so there is no signer trail.</p>')+
   (d.cert?'<p class="small" style="margin:10px 0 0"><span class="pill ok">Signed '+d.signedOn+'</span> <span class="muted">Certificate</span> <span class="mono">'+d.cert+'</span></p>':'')+
   (d.st==='Pending signature'&&can('sign')?'<div style="margin-top:10px">'+btn('Send reminder','signrem','data-id="'+d.id+'"','sm')+'</div>':'')+'</div>';
}
function docViewer(id){
  const d=D.docs.find(x=>x.id===id);if(!d){back();return}
  const s=dst(d),isImg=d.data&&/^data:image/.test(d.data),isTxt=d.text!==undefined,edit=!!S.dedit,canE=can('docs');
  let pv;
  if(isImg)pv='<img class="prev" src="'+d.data+'" alt="'+esc(d.name)+'">';
  else if(isTxt)pv=(d.st==='Draft'&&canE?'<textarea id="dv-text" class="tx" style="width:100%">'+esc(d.text)+'</textarea><div style="margin-top:8px">'+btn('Save as new version','dtext','data-id="'+d.id+'"','sm primary')+'</div>':'<div class="prevbox">'+esc(d.text)+'</div>');
  else pv='<div class="prevbox" style="text-align:center;color:var(--muted)">'+ic('file')+'<div style="margin-top:8px">'+(d.data?'Preview for this file type is not shown in the prototype.':'Sample file. No content is stored in the demo.')+'</div><div class="small">Name, versions, sign-off and access trail are fully tracked.</div></div>';
  const info='<dl class="kv"><dt>Attached to</dt><dd>'+esc(KINDS.find(k=>k[0]===d.kind)[1])+': '+esc(entLabel(d))+'</dd><dt>Type</dt><dd>'+esc(d.type)+'</dd><dt>Version</dt><dd>v'+d.ver+'</dd><dt>Size</dt><dd>'+fmtSize(d.size)+'</dd><dt>Uploaded</dt><dd>'+d.on+' by '+esc(d.by)+'</dd><dt>Expires</dt><dd>'+(d.exp||'None')+'</dd><dt>Who can see</dt><dd>'+(d.vis==='shared'?'Shared with the customer, supplier and worker on this record':'Internal only')+'</dd>'+(d.note?'<dt>Note</dt><dd>'+esc(d.note)+'</dd>':'')+'</dl>';
  const form='<div class="stack" style="gap:10px">'+fld('de-n','Name',d.name)+'<div class="f2">'+sel('de-t','Type',DOC_TYPES.map(t=>[t,t]),d.type)+sel('de-v','Who can see it',VIS,d.vis)+'</div><div class="f2">'+fld('de-x','Expires on',d.exp||'','date')+fld('de-o','Note',d.note)+'</div><div class="row" style="justify-content:flex-start">'+btn('Save details','dsave','data-id="'+d.id+'"','sm primary')+btn('Cancel','dedit','','sm')+'</div></div>';
  modal(esc(d.name),
   '<div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">'+badge(s,DB[s])+badge(d.type,'info')+(d.vis==='shared'?badge('Shared',''):badge('Internal',''))+'</div>'+
   '<div class="grid g2"><div>'+pv+'</div><div>'+(edit?form:info)+'</div></div>'+
   '<div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:8px">'+(canE?'<label class="btn sm" for="dv-f" style="cursor:pointer">'+ic('upload')+' Upload new version</label><input type="file" id="dv-f" data-a="newver" data-id="'+d.id+'" style="display:none">'+btn('Edit details','dedit','','sm'):'')+(SIGN_TYPES.includes(d.type)&&['Draft','Active','Declined'].includes(d.st)&&can('sign')?btn(ic('pen')+' Send for signature','signopen','data-id="'+d.id+'"','sm primary'):'')+(can('docdel')?btn(ic('trash')+' Remove','docdel','data-id="'+d.id+'" data-from="v"','sm danger'):'')+'</div>'+
   sigBlock(d)+
   '<div><h3>Versions</h3>'+tbl(['Version','File','Size','Uploaded',''],d.vers.slice().reverse().map(v=>'<tr><td>v'+v.v+(v.v===d.ver?' <span class="pill ok">Current</span>':'')+'</td><td>'+esc(v.name)+'</td><td>'+fmtSize(v.size)+'</td><td class="mono">'+v.on+' · '+esc(v.by)+'</td><td>'+(v.v!==d.ver&&canE?btn('Make current','verrest','data-id="'+d.id+'" data-v="'+v.v+'"','sm'):'')+'</td></tr>'),'tight')+'</div>'+
   '<div><h3>Activity</h3>'+d.hist.slice().reverse().slice(0,10).map(h=>'<div class="row small" style="padding:5px 0;border-bottom:1px dashed var(--line)"><span>'+esc(h.act)+'</span><span class="muted">'+esc(h.by)+' · '+h.t+'</span></div>').join('')+'</div>',
   btn('Close','close'),true);
}
ACT.docopen=d=>{const x=D.docs.find(q=>q.id===d.id);if(x&&x.hist.length&&!(x.hist[x.hist.length-1].act==='Viewed'&&x.hist[x.hist.length-1].by===ME.name))hist(x,'Viewed');S.dedit=false;openLayer(()=>docViewer(d.id),true)};
ACT.dedit=()=>{S.dedit=!S.dedit;refresh()};
ACT.dsave=d=>{const x=D.docs.find(q=>q.id===d.id);if(!val('de-n')){toast('Add a name');return}const ch=[];if(x.type!==val('de-t'))ch.push('type');if(x.vis!==val('de-v'))ch.push('visibility');x.name=val('de-n');x.type=val('de-t');x.vis=val('de-v');x.exp=val('de-x')||null;x.note=val('de-o');hist(x,'Details edited'+(ch.length?' ('+ch.join(', ')+')':''));S.dedit=false;log('Edited document details',x.name,'Documents');toast('Details saved');refresh()};
ACT.newver=(d,el)=>readFiles(el.files).then(arr=>{const f=arr[0];if(!f)return;const x=D.docs.find(q=>q.id===d.id);
  if(storeUsed()+f.size>storeLimit()){toast('Storage limit reached');return}
  x.ver++;x.size=f.size;x.data=f.data;x.mime=f.mime||x.mime;delete x.text;x.vers.push({v:x.ver,name:f.name,size:f.size,on:TODAY,by:ME.name,data:f.data});x.on=TODAY;x.by=ME.name;hist(x,'New version v'+x.ver+' uploaded');
  if(SIGN_TYPES.includes(x.type)&&x.st==='Signed'){x.st='Draft';x.sign=null;x.cert=null;hist(x,'Signature cleared because the file changed')}
  log('Uploaded new version v'+x.ver,x.name,'Documents');toast('Version '+x.ver+' saved'+(x.st==='Draft'?'. It needs a new signature.':''));refresh()});
ACT.verrest=d=>{const x=D.docs.find(q=>q.id===d.id),v=x.vers.find(q=>q.v===+d.v);x.ver++;x.size=v.size;x.data=v.data;if(v.text!==undefined)x.text=v.text;x.vers.push({v:x.ver,name:v.name,size:v.size,on:TODAY,by:ME.name,data:v.data,text:v.text});hist(x,'Restored v'+v.v+' as v'+x.ver);toast('Version '+v.v+' is current again (now v'+x.ver+')');refresh()};
ACT.dtext=d=>{const x=D.docs.find(q=>q.id===d.id),t=document.getElementById('dv-text').value;if(t===x.text){toast('No changes to save');return}x.text=t;x.ver++;x.size=t.length;x.vers.push({v:x.ver,name:x.name,size:t.length,on:TODAY,by:ME.name,data:null,text:t});hist(x,'Edited draft (v'+x.ver+')');toast('Saved as v'+x.ver);refresh()};
ACT.docdel=d=>{const x=D.docs.find(q=>q.id===d.id);if(!x)return;D.docs=D.docs.filter(q=>q!==x);D.bin.unshift({id:'b'+Date.now(),type:'Document',name:x.name+' ('+entLabel(x)+')',by:initials(ME.name),on:TODAY,left:+ORG().ret||120,obj:x});log('Removed document (in recycle bin)',x.name,'Documents');toast(x.name+' removed. Restore it from Audit & Recycle Bin.');if(d.from==='v')back();refresh()};

/* ---- e-signature ---- */
function signModal(id){
  const d=D.docs.find(x=>x.id===id),i=entInfo(d);let p1=['',''];
  if(d.kind==='supplier'){const s=supOf(d.key);p1=[d.key,s?s.contact:'']}else if(d.kind==='candidate')p1=[d.key.split('|')[0],''];else if(d.kind==='worker')p1=[entLabel(d),''];else p1=[(i.client||'Customer')+' signatory',''];
  const row=(k,n,e)=>'<div class="f2">'+fld('sg-n'+k,'Signer '+(k+1)+' name',n)+fld('sg-e'+k,'Email',e,'email')+'</div>';
  modal('Send for signature','<div class="note"><b>'+esc(d.name)+'</b> goes to each signer in order. Their identity, time and a tamper hash are saved.</div>'+row(0,p1[0],p1[1])+row(1,ME.name,ME.email)+row(2,'','')+sel('sg-o','Signing order',[['Sequential','One after another'],['Parallel','All at once']],'Sequential')+fld('sg-m','Message to signers','Please review and sign.')+(D.ints.find(x=>x.id==='esign').on?'':'<div class="note warn">DocuSign or Adobe Sign is not connected in Integrations. This demo sends anyway.</div>'),btn('Cancel','close')+btn('Send','signsend','data-id="'+id+'"','primary'));
}
ACT.signopen=d=>openLayer(()=>signModal(d.id),true);
ACT.signsend=d=>{const x=D.docs.find(q=>q.id===d.id),sg=[];
  for(let k=0;k<3;k++){const n=val('sg-n'+k),e=val('sg-e'+k);if(!n&&!e)continue;if(!n||!/^\S+@\S+\.\S+$/.test(e)){toast('Signer '+(k+1)+' needs a name and a valid email');return}sg.push({n:n,e:e,st:sg.length&&val('sg-o')==='Sequential'?'Waiting':'Sent',on:null})}
  if(!sg.length){toast('Add at least one signer');return}
  const es=D.ints.find(i=>i.id==='esign');x.sign={sent:nowStamp(),via:es.on?es.n:'E-signature (demo)',order:val('sg-o'),signers:sg};x.st='Pending signature';hist(x,'Sent for signature to '+sg.map(s=>s.n).join(', '));
  log('Sent for signature',x.name,'E-sign');toast('Sent to '+sg.length+' signer'+(sg.length>1?'s':'')+' from '+SYS());back();render()};
ACT.signmark=d=>{const x=D.docs.find(q=>q.id===d.id),g=x.sign.signers[+d.i];g.st='Signed';g.on=nowStamp();hist(x,g.n+' signed');const nx=x.sign.signers.find(q=>q.st==='Waiting');if(nx&&x.sign.order==='Sequential')nx.st='Sent';
  if(x.sign.signers.every(q=>q.st==='Signed')){markSigned(x,'all signers');log('Document fully signed',x.name,'E-sign');toast(x.name+' is fully signed')}else toast(g.n+' signed. Waiting on the rest.');refresh()};
ACT.signdec=d=>{const x=D.docs.find(q=>q.id===d.id),g=x.sign.signers[+d.i];g.st='Declined';x.st='Declined';hist(x,g.n+' declined');log('Signer declined',x.name,'E-sign');toast(g.n+' declined to sign');refresh()};
ACT.signrem=d=>{const x=D.docs.find(q=>q.id===d.id);hist(x,'Reminder sent');toast('Reminder sent to the waiting signers')};

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c.length||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
const IMP_COLS={candidates:'name, requisition, supplier, skills (separate with ;), experience, rate, location, availability_days',suppliers:'name, email, tier, category'};
function impSample(type){
  const r=D.reqs.find(openReq),s=D.sups[0];
  if(type==='suppliers')return 'name,email,tier,category\nOrion Talent,hello@orion-talent.example,2,Staffing\nCedar Digital,ops@cedar.example,3,Non-staffing\n'+(s?s.n+','+s.contact+',1,Staffing\n':'');
  if(!r||!s)return '';
  const ex=D.cands[0];
  return 'name,requisition,supplier,skills,experience,rate,location,availability_days\nPriya Raman,'+r.id+','+s.n+',"'+r.skills.join(';')+'",8,'+Math.round(r.rate*.9)+',"'+r.loc+'",7\nNoah Fischer,'+r.id+','+s.n+',Python;SQL,5,70,Remote,14\n'+(ex?ex.n+','+ex.req+','+ex.sup+',"'+ex.skills.join(';')+'",'+ex.exp+','+ex.rate+',"'+ex.loc+'",'+ex.av+'\n':'')+'Ana Lopes,'+r.id+',Unknown Staffing Co,Java,4,70,Remote,10\n';
}
function impEval(type,text){
  const rows=parseCSV(text),hd=(rows.shift()||[]).map(h=>h.trim().toLowerCase().replace(/\s+/g,'_')),ix=n=>hd.indexOf(n),ok=[],bad=[];let dup=0;
  const need=type==='suppliers'?['name']:['name','requisition','supplier'];
  const miss=need.filter(n=>ix(n)<0);if(miss.length)return {err:'Missing column'+(miss.length>1?'s':'')+': '+miss.join(', ')+'. Found: '+(hd.join(', ')||'nothing')};
  const g=(r,n)=>ix(n)>=0?(r[ix(n)]||'').trim():'';
  rows.forEach((r,i)=>{
    const n=g(r,'name');if(!n){bad.push('Row '+(i+2)+': no name');return}
    if(type==='suppliers'){if(D.sups.find(s=>s.n.toLowerCase()===n.toLowerCase())||ok.find(o=>o.n.toLowerCase()===n.toLowerCase())){dup++;return}
      ok.push({n:n,tier:+g(r,'tier')||3,w:0,score:60,fill:0,comp:0,int:0,ttf:null,ai:50,st:'Onboarding',cat:g(r,'category')||'Staffing',contract:'Not sent',payout:'Pending',coi:TODAY,contact:g(r,'email')||''});return}
    const rq=g(r,'requisition'),sp=g(r,'supplier');
    if(!reqOf(rq)){bad.push('Row '+(i+2)+' ('+n+'): unknown requisition '+(rq||'(blank)'));return}
    if(!D.sups.find(s=>s.n===sp)){bad.push('Row '+(i+2)+' ('+n+'): unknown supplier '+(sp||'(blank)'));return}
    if(D.cands.find(c=>c.n.toLowerCase()===n.toLowerCase()&&c.req===rq)||ok.find(o=>o.n.toLowerCase()===n.toLowerCase()&&o.req===rq)){dup++;return}
    ok.push({n:n,skills:g(r,'skills').split(/[;|]/).map(x=>x.trim()).filter(Boolean),exp:+g(r,'experience')||0,rate:+g(r,'rate')||0,sup:sp,req:rq,st:'Submitted',loc:g(r,'location')||'Remote',av:+g(r,'availability_days')||0});
  });
  return {ok:ok,bad:bad,dup:dup,total:rows.length};
}
function impResult(){const e=S.imx.res;if(!e)return '';if(e.err)return '<div class="note bad">'+esc(e.err)+'</div>';
  return '<div class="note">'+e.total+' rows read. <b>'+e.ok.length+' new</b>, '+e.dup+' duplicate'+(e.dup===1?'':'s')+' skipped, '+e.bad.length+' with problems.</div>'+(e.bad.length?'<div class="note warn" style="margin-top:8px">'+e.bad.slice(0,5).map(esc).join('<br>')+(e.bad.length>5?'<br>and '+(e.bad.length-5)+' more':'')+'</div>':'')+(e.ok.length?'<div style="margin-top:12px">'+btn('Import '+e.ok.length+' '+S.imx.type,'impgo','','primary')+'</div>':'')}

const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCSV(cols,rows){return [cols.join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\n')+'\n'}

   ['customer_invoices',['Invoice','Customer','Period','Amount','Due','Status'],D.ar.map(a=>[a.id,a.c,a.per,a.amt,a.due,a.st])],
   ['supplier_invoices',['Invoice','Supplier','PO','Period','Amount','Status'],D.ap.map(a=>[a.id,a.v,a.po,a.per,a.amt,a.st])],
   ['purchase_orders',['PO','Type','Party','Description','Cap','Used','Division'],D.pos.map(p=>[p.id,p.type,p.party,p.title,p.cap,p.used,p.div])],
   ['sows',['SOW','Customer','Title','Type','Status','Start','End','Value'],D.sows.map(s=>[s.id,s.customer,s.title,s.type,s.st,s.start,s.end,sowValue(s)])],
   ['documents',['ID','Name','Type','Attached to','Version','Status','Expires','Uploaded by','Uploaded'],D.docs.map(x=>[x.id,x.name,x.type,x.kind+': '+entLabel(x),'v'+x.ver,dst(x),x.exp||'',x.by,x.on])],

ACT.doapprove=()=>{
  const ids=S.ap,L=ids.map(id=>lineOf(D.ts.find(t=>t.id===id))),blk=L.some(l=>l.block),c=CTL();
  if(val('ap-n').length<3){toast('Type your full name to sign');return}
  if(!document.getElementById('ap-c').checked){toast('Tick the confirmation box');return}
  if(blk&&val('ap-r').length<8){toast('Add a reason for the override');return}
  const stamp=nowStamp();let dual=0;
  ids.forEach(id=>{const t=D.ts.find(x=>x.id===id),l=lineOf(t),needs=c.dual>0&&l.out>=c.dual;if(needs)dual++;
    t.pay=needs?'approval2':'approved';t.ap1={by:val('ap-n'),role:ROLES[S.role].n,on:stamp};
    D.audit.unshift({t:stamp,a:val('ap-n')+' ('+ROLES[S.role].n+')',act:(needs?'First approval of payout, second approval needed':'Approved payout')+(l.block?' (override: '+val('ap-r')+')':''),tg:id,ev:'SSO + e-sign '+hash(id+val('ap-n')+stamp)})});
  S.sel={};closeLayer();toast(ids.length+' payout'+(ids.length>1?'s':'')+' approved'+(dual?'. '+dual+' need a second approver.':' and signed'));render();
};

function parseResume(t){
  const lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),o={skills:[]};
  if(lines[0]&&lines[0].length<=40&&lines[0].indexOf('@')<0&&/[a-z]/i.test(lines[0]))o.name=lines[0].replace(/[^\w .'-]/g,'').trim();
  const em=t.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);if(em)o.email=em[0];
  const yrs=[...t.matchAll(/(\d{1,2})\+?\s*(?:years|yrs)/gi)].map(x=>+x[1]);if(yrs.length)o.exp=Math.max.apply(null,yrs);
  SKILLS.forEach(s=>{if(new RegExp('(^|[^A-Za-z0-9])'+escRe(s)+'([^A-Za-z0-9]|$)','i').test(t))o.skills.push(s)});

}

ACT.savecand=()=>{
  const n=val('nc-n'),rq=val('nc-r'),em=val('nc-em');if(!n||!rq){toast('Add the name and choose a requisition');return}
  const i=dupInfo(n,em,rq);
  if(i.same){document.getElementById('nc-dup').innerHTML=dupNote();toast('Already submitted for this requisition by '+i.same.sup);return}
  if(i.other.length&&!S.ncConfirm){S.ncConfirm=true;document.getElementById('nc-dup').innerHTML=dupNote()+'<p class="small muted" style="margin:6px 0 0">Press Submit again to send it anyway.</p>';return}
  const c={n:n,email:em,skills:val('nc-s').split(',').map(x=>x.trim()).filter(Boolean),exp:+val('nc-e')||0,rate:+val('nc-rate')||0,sup:val('nc-v'),req:rq,st:'Submitted',loc:val('nc-l'),av:+val('nc-a')||0};
  D.cands.push(c);const r=reqOf(rq);if(r)r.subs++;
  if(S.ncFile){const d=mkDoc('candidate',n+'|'+rq,S.ncFile,{type:'Resume',vis:'shared'});d.by=c.sup}
  else if(S.ncText){const d=mkDoc('candidate',n+'|'+rq,{name:n.replace(/\s+/g,'_')+'_Resume.txt',size:S.ncText.length,mime:'text/plain',data:null,text:S.ncText},{type:'Resume',vis:'shared'});d.by=c.sup}
  log('Submitted candidate',n+' for '+rq+(i.other.length?' (possible duplicate, submitted anyway)':''));closeLayer();toast(n+' submitted and ranked'+(S.ncFile||S.ncText?'. Resume attached.':''));render();
};
ACT.dupscan=()=>{
  const g={};D.cands.filter(c=>c.st!=='Rejected'&&vCands().includes(c)).forEach(c=>{(g[norm(c.n)]=g[norm(c.n)]||[]).push(c)});
  const dup=Object.values(g).filter(a=>a.length>1);
  modal('Find duplicate candidates',dup.length?'<p class="muted" style="margin:0">The same person submitted more than once. Keep the first submission so the supplier who sent it first gets credit. The others go to the recycle bin.</p>'+dup.map(a=>'<div class="panel" style="padding:14px"><b>'+esc(a[0].n)+'</b>'+a.map(c=>'<div class="row small" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span>'+esc(c.sup)+' · '+c.req+' · '+badge(c.st)+'</span>'+btn('Keep this one','dupkeep','data-n="'+esc(c.n)+'" data-s="'+esc(c.sup)+'" data-r="'+c.req+'"','sm')+'</div>').join('')+'</div>').join(''):'<div class="note">No duplicates found among '+vCands().length+' candidates.</div>',btn('Close','close'));
};
ACT.dupkeep=d=>{const keep=D.cands.find(c=>c.n===d.n&&c.sup===d.s&&c.req===d.r);const others=D.cands.filter(c=>c!==keep&&c.st!=='Rejected'&&norm(c.n)===norm(d.n));
  others.forEach(c=>{D.cands=D.cands.filter(x=>x!==c);D.bin.unshift({id:'b'+Date.now()+c.req,type:'Candidate',name:c.n+' (duplicate from '+c.sup+')',by:initials(ME.name),on:TODAY,left:+ORG().ret||120,obj:c})});
  log('Resolved duplicate: kept '+keep.sup+' submission',d.n,'Duplicates');toast('Kept '+keep.sup+'. '+others.length+' duplicate'+(others.length>1?'s':'')+' moved to the recycle bin.');ACT.dupscan();render()};

function summarize(t){
  const s=(t.match(/[^.!?\n]+[.!?]?/g)||[]).map(x=>x.trim()).filter(x=>x.length>25);if(!s.length)return null;
  const STOP=new Set(['that','this','with','from','have','will','they','their','been','were','also','about','more','than','which','into','over','after','your','what','when','there','would','could','should']),words=t.toLowerCase().match(/[a-z]{4,}/g)||[],f={};
  words.forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});
  const sc=s.map((x,i)=>({x:x,i:i,v:(x.toLowerCase().match(/[a-z]{4,}/g)||[]).reduce((a,w)=>a+(f[w]||0),0)/Math.sqrt(x.length)}));
  return {pts:sc.slice().sort((a,b)=>b.v-a.v).slice(0,3).sort((a,b)=>a.i-b.i).map(o=>o.x),kw:Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0])};
}

/* ================= Mobile support ================= */
function stackTables(root){
  (root||document).querySelectorAll('table.tbl:not(.perm):not(.stk)').forEach(t=>{
    const hs=Array.from(t.querySelectorAll('thead th')).map(h=>h.textContent.trim());
    t.classList.add('stk');
    t.querySelectorAll('tbody tr').forEach(tr=>{
      if(tr.classList.contains('grp'))return;
      let title=false;
      Array.from(tr.children).forEach((td,i)=>{
        const lab=hs[i]||'';td.setAttribute('data-label',lab);
        if(!td.firstElementChild||!td.firstElementChild.classList.contains('tv')){const w=document.createElement('div');w.className='tv';while(td.firstChild)w.appendChild(td.firstChild);td.appendChild(w)}
        if(!lab){td.classList.add(td.querySelector('input[type=checkbox]')?'selc':'ac')}
        else if(!title){td.classList.add('tt');title=true}
      });
    });
  });
}
function setPlaceholder(){const q=document.getElementById('q');if(q)q.placeholder=innerWidth<700?'Search':'Jump to anything: requisitions, candidates, suppliers, workers, POs'}
function initMobile(){
  let pend=false;const run=()=>{pend=false;stackTables(document.getElementById('page'));stackTables(document.getElementById('layer'))};
  const mo=new MutationObserver(()=>{if(!pend){pend=true;requestAnimationFrame(run)}});
  ['page','layer'].forEach(id=>mo.observe(document.getElementById(id),{childList:true,subtree:true}));
  setPlaceholder();addEventListener('resize',setPlaceholder);run();
}

});

  const q=e.target.value.trim().toLowerCase(),box=$('#res');if(!q){box.hidden=true;return}
  const hits=[];
  D.reqs.forEach(r=>{if((r.id+r.title+r.skills.join(' ')).toLowerCase().includes(q))hits.push(['requisitions','Requisition',r.id+' · '+r.title,r.client,'req:'+r.id])});
  D.cands.forEach(c=>{if((c.n+c.skills.join(' ')).toLowerCase().includes(q))hits.push(['candidates','Candidate',c.n,c.req,''])});
  D.sups.forEach(s=>{if(s.n.toLowerCase().includes(q))hits.push(['suppliers','Supplier',s.n,'Tier '+s.tier,'sup:'+s.n])});
  D.workers.forEach(w=>{if((w.n+w.role).toLowerCase().includes(q))hits.push(['workforce','Worker',w.n,w.role,''])});
  D.pos.forEach(p=>{if((p.id+p.party+p.title).toLowerCase().includes(q))hits.push(['contracts','PO',p.id+' · '+p.party,p.type,'po:'+p.type])});
  D.ts.forEach(t=>{if(t.id.toLowerCase().includes(q))hits.push(['payments','Timesheet',t.id,wk(t.w).n,''])});
  const H=hits.filter(h=>pageOk(h[0])).slice(0,9);
  box.innerHTML=H.length?H.map((h,i)=>'<div data-i="'+i+'">'+badge(h[1],'info')+'<span>'+esc(h[2])+'</span><small>'+esc(h[3])+'</small></div>').join(''):'<div class="muted">No matches</div>';
  box.hidden=false;box._h=H;
});
